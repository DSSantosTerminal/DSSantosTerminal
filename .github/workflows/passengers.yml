name: Passenger counter

# Redraws assets/passengers.svg with the latest visit count once a day.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_displays.py
      - name: Commit the new count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/passengers.svg
          git diff --cached --quiet || { git commit -m "Update passenger count" && git push; }
